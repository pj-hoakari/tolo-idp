name: Build and publish container image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release version
        id: version
        uses: pj-hoakari/actions/resolve-version@d619552a3e89628f83a45f57ac80e9e9c9590859

  build:
    needs: version
    uses: ./.github/workflows/build-test.yml
    with:
      version: ${{ needs.version.outputs.version }}
      export-images: true

  publish:
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        runtime: [native, jvm]
    env:
      REPOSITORY: ${{ github.repository }}
      IMAGE_RUNTIME: ${{ matrix.runtime }}
      IMAGE_SUFFIX: ${{ matrix.runtime == 'jvm' && '-jvm' || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Revalidate release version before publishing
        uses: pj-hoakari/actions/resolve-version@d619552a3e89628f83a45f57ac80e9e9c9590859

      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/${REPOSITORY,,}$IMAGE_SUFFIX" >> "$GITHUB_OUTPUT"

      - name: Download tested Buildpacks images
        uses: actions/download-artifact@v4
        with:
          pattern: buildpacks-${{ matrix.runtime }}-*
          path: build/ci-images

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Buildpacks base manifest
        id: base
        run: |
          set -euo pipefail
          image="ghcr.io/${REPOSITORY,,}-buildpacks"
          run_tag="build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${IMAGE_RUNTIME}"
          sources=()
          for arch in amd64 arm64; do
            docker image load --input "build/ci-images/buildpacks-${IMAGE_RUNTIME}-${arch}/image.tar"
            source="$image:$run_tag-$arch"
            docker image tag "tolo-idp-base:$IMAGE_RUNTIME-$arch" "$source"
            docker image push "$source"
            digest=$(docker buildx imagetools inspect "$source" --format '{{.Manifest.Digest}}')
            sources+=("$image@$digest")
          done
          docker buildx imagetools create --tag "$image:$run_tag" "${sources[@]}"
          digest=$(docker buildx imagetools inspect "$image:$run_tag" --format '{{.Manifest.Digest}}')
          echo "image=$image@$digest" >> "$GITHUB_OUTPUT"

      - name: Prepare release Dockerfile
        env:
          BASE_IMAGE: ${{ steps.base.outputs.image }}
        run: >-
          awk -v base="$BASE_IMAGE"
          '/^ARG BASE_IMAGE=/ { print "ARG BASE_IMAGE=" base; next } { print }'
          Dockerfile > Dockerfile.release

      - name: Publish final multi-arch image
        uses: pj-hoakari/actions/publish-image@d619552a3e89628f83a45f57ac80e9e9c9590859
        with:
          version: ${{ needs.version.outputs.version }}
          image: ${{ steps.image.outputs.name }}
          file: ./Dockerfile.release
          cache-scope: tolo-idp-${{ matrix.runtime }}

      - name: Verify published platforms
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker buildx imagetools inspect "$IMAGE:$VERSION" --raw \
            | jq -e '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort == ["amd64", "arm64"]'
