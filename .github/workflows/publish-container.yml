name: Build and publish container image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release version
        id: version
        uses: pj-hoakari/actions/resolve-version@d619552a3e89628f83a45f57ac80e9e9c9590859

  build:
    needs: version
    uses: ./.github/workflows/build-test.yml
    with:
      version: ${{ needs.version.outputs.version }}
      export-images: true

  publish:
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      REPOSITORY: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Revalidate release version before publishing
        uses: pj-hoakari/actions/resolve-version@d619552a3e89628f83a45f57ac80e9e9c9590859

      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Download tested Native images
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: build/ci-images

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested Native images and multi-arch manifest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail
          run_tag="build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sources=()
          for arch in amd64 arm64; do
            docker image load --input "build/ci-images/native-${arch}/image.tar"
            source="$IMAGE:$run_tag-$arch"
            docker image tag "tolo-idp-ci:native-$arch" "$source"
            docker image push "$source"
            digest=$(docker buildx imagetools inspect "$source" --format '{{.Manifest.Digest}}')
            sources+=("$IMAGE@$digest")
          done
          tags=(--tag "$IMAGE:$VERSION" --tag "$IMAGE:sha-${GITHUB_SHA:0:7}")
          if [[ "$VERSION" != *-* ]]; then tags+=(--tag "$IMAGE:latest"); fi
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"

      - name: Verify published platforms
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker buildx imagetools inspect "$IMAGE:$VERSION" --raw \
            | jq -e '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort == ["amd64", "arm64"]'
