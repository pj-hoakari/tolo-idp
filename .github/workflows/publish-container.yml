name: Build and publish container image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Resolve release version
        id: version
        uses: pj-hoakari/actions/resolve-version@e0ffe48f766307783a545c33bc29d58362094572 # v20261113.0.0

  build:
    needs: version
    uses: ./.github/workflows/build-test.yml
    with:
      version: ${{ needs.version.outputs.version }}
      export-images: true

  publish:
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        runtime: [native, jvm]
    env:
      IMAGE_RUNTIME: ${{ matrix.runtime }}
      IMAGE_SUFFIX: ${{ matrix.runtime == 'jvm' && '-jvm' || '' }}
      REPOSITORY: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Revalidate release version before publishing
        uses: pj-hoakari/actions/resolve-version@e0ffe48f766307783a545c33bc29d58362094572 # v20261113.0.0

      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/${REPOSITORY,,}$IMAGE_SUFFIX" >> "$GITHUB_OUTPUT"

      - name: Download tested application images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: ${{ matrix.runtime }}-*
          path: build/ci-images

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested images and multi-arch manifest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail
          run_tag="build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sources=()
          for arch in amd64 arm64; do
            docker image load --input "build/ci-images/${IMAGE_RUNTIME}-${arch}/image.tar"
            source="$IMAGE:$run_tag-$arch"
            docker image tag "tolo-idp-ci:$IMAGE_RUNTIME-$arch" "$source"
            docker image push "$source"
            digest=$(docker buildx imagetools inspect "$source" --format '{{.Manifest.Digest}}')
            sources+=("$IMAGE@$digest")
          done
          tags=(--tag "$IMAGE:$VERSION" --tag "$IMAGE:sha-${GITHUB_SHA:0:7}")
          if [[ "$VERSION" != *-* ]]; then tags+=(--tag "$IMAGE:latest"); fi
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"

      - name: Verify published platforms
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker buildx imagetools inspect "$IMAGE:$VERSION" --raw \
            | jq -e '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort == ["amd64", "arm64"]'
