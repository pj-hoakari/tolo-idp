name: Build and publish container image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tags: ${{ steps.version.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release version
        id: version
        uses: pj-hoakari/actions/resolve-version@6cb0d060da6c0f7e2d5e2ceacccc82103b2279bf # pj-hoakari/actions#4

  build:
    needs: version
    uses: ./.github/workflows/build-test.yml
    with:
      version: ${{ needs.version.outputs.version }}
      export-images: true

  publish:
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        runtime: [native, jvm]
    env:
      REPOSITORY: ${{ github.repository }}
      IMAGE_RUNTIME: ${{ matrix.runtime }}
    steps:
      - uses: actions/checkout@v4

      - name: Revalidate release version before publishing
        uses: pj-hoakari/actions/resolve-version@6cb0d060da6c0f7e2d5e2ceacccc82103b2279bf # pj-hoakari/actions#4

      - name: Download tested Buildpacks images
        uses: actions/download-artifact@v4
        with:
          pattern: buildpacks-${{ matrix.runtime }}-*
          path: build/ci-images

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Buildpacks base manifest
        id: base
        run: bash .github/scripts/publish-buildpacks-base.sh

      - name: Publish final multi-arch image
        uses: pj-hoakari/actions/publish-image@6cb0d060da6c0f7e2d5e2ceacccc82103b2279bf # pj-hoakari/actions#4
        with:
          version: ${{ needs.version.outputs.version }}
          tags: ${{ needs.version.outputs.tags }}
          tag-suffix: ${{ matrix.runtime == 'jvm' && '-jvm' || '' }}
          build-args: BASE_IMAGE=${{ steps.base.outputs.image }}
          cache-scope: tolo-idp-${{ matrix.runtime }}

      - name: Verify published platforms
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SUFFIX: ${{ matrix.runtime == 'jvm' && '-jvm' || '' }}
        run: |
          docker buildx imagetools inspect "ghcr.io/${REPOSITORY,,}:$VERSION$SUFFIX" --raw \
            | jq -e '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort == ["amd64", "arm64"]'
