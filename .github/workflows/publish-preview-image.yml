name: Publish Preview Image

on:
  workflow_dispatch:
    inputs:
      pull-request:
        description: "イメージを公開するプルリクエストの番号"
        required: true
        type: number
  workflow_call:
    inputs:
      pull-request:
        description: "イメージを公開するプルリクエストの番号"
        required: true
        type: number

permissions:
  contents: read
  packages: write
  pull-requests: read

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Resolve pull request head
        id: pr
        uses: pj-hoakari/actions/pull-request-head@e0ffe48f766307783a545c33bc29d58362094572 # v20261113.0.0
        with:
          number: ${{ inputs.pull-request }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.pr.outputs.sha }}

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "24"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Resolve image name
        id: image
        env:
          TAG: ${{ steps.pr.outputs.tag }}
        run: echo "name=ghcr.io/${REPOSITORY,,}:$TAG" >> "$GITHUB_OUTPUT"

      - name: Build Native image with Buildpacks
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: >-
          ./gradlew bootBuildImage --no-daemon
          -PimageRuntime=native
          "--imageName=$IMAGE"
          --imagePlatform=linux/amd64

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: docker image push "$IMAGE"
