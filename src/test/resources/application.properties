spring.security.oauth2.authorizationserver.client.esp-camera.registration.client-name=ESP camera
spring.security.oauth2.authorizationserver.client.esp-camera.registration.client-authentication-methods=none
spring.security.oauth2.authorizationserver.client.esp-camera.registration.authorization-grant-types=urn:ietf:params:oauth:grant-type:device_code,refresh_token
spring.security.oauth2.authorizationserver.client.esp-camera.registration.scopes=events.stream
spring.security.oauth2.authorizationserver.client.esp-camera.require-proof-key=false
spring.security.oauth2.authorizationserver.client.esp-camera.require-authorization-consent=false
spring.security.oauth2.authorizationserver.client.esp-camera.token.access-token-format=self-contained
spring.security.oauth2.authorizationserver.client.esp-camera.token.reuse-refresh-tokens=false
