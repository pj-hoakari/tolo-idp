tolo-idp.seed.enabled=true
spring.security.oauth2.authorizationserver.client.client-123.registration.client-id=client-123
spring.security.oauth2.authorizationserver.client.client-123.registration.client-secret=${tolo-idp.seed.client-secret:secret}
spring.security.oauth2.authorizationserver.client.client-123.registration.client-name=Development confidential client
spring.security.oauth2.authorizationserver.client.client-123.registration.client-authentication-methods=client_secret_basic,client_secret_post
spring.security.oauth2.authorizationserver.client.client-123.registration.authorization-grant-types=authorization_code,refresh_token,urn:ietf:params:oauth:grant-type:token-exchange
spring.security.oauth2.authorizationserver.client.client-123.registration.redirect-uris=http://127.0.0.1:8080/login/oauth2/code/client-123,http://127.0.0.1:18080/login/oauth2/code/client-123,http://localhost:3000/api/auth/callback/tolo-idp
spring.security.oauth2.authorizationserver.client.client-123.registration.scopes=openid,profile,tenant.read,tenant.write,tenant.claim,events.read,events.manage,events.operate,events.report
spring.security.oauth2.authorizationserver.client.client-123.require-proof-key=true
spring.security.oauth2.authorizationserver.client.client-123.require-authorization-consent=false
spring.security.oauth2.authorizationserver.client.client-123.token.authorization-code-time-to-live=5m
spring.security.oauth2.authorizationserver.client.client-123.token.access-token-time-to-live=15m
spring.security.oauth2.authorizationserver.client.client-123.token.access-token-format=self-contained
tolo-idp.jwk.allow-ephemeral=true
tolo-idp.rate-limit.enabled=false
tolo-idp.cors.allowed-origins=http://localhost:3000
spring.datasource.url=jdbc:h2:mem:tolo-idp-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_UPPER=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
tolo-idp.clients.client-123.allowed-audiences=backend-api
tolo-idp.clients.client-123.allowed-token-exchange-transitions=tenant_access:event_access
tolo-idp.clients.client-123.tenant-access-ttl=15m
tolo-idp.clients.client-123.event-access-ttl=10m

spring.security.oauth2.authorizationserver.client.client-123.token.reuse-refresh-tokens=false
spring.security.oauth2.authorizationserver.client.client-123.token.refresh-token-time-to-live=1h
