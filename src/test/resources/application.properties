spring.security.oauth2.authorizationserver.client.console-ui.registration.redirect-uris=http://localhost:3000/api/auth/callback/console-ui,http://127.0.0.1:3000/api/auth/callback/console-ui,http://localhost:3000/api/auth/callback/tolo-idp,http://127.0.0.1:3000/api/auth/callback/tolo-idp
spring.security.oauth2.authorizationserver.client.console-ui.registration.scopes=openid,profile,tenant.read,tenant.write,tenant.join,events.read,events.manage,events.operate,events.report
spring.security.oauth2.authorizationserver.client.console-ui.require-proof-key=true
spring.security.oauth2.authorizationserver.client.console-ui.require-authorization-consent=false
spring.security.oauth2.authorizationserver.client.console-ui.token.access-token-format=self-contained
spring.security.oauth2.authorizationserver.client.console-ui.token.reuse-refresh-tokens=false
spring.security.oauth2.authorizationserver.client.console-ui.token.refresh-token-time-to-live=1h
spring.security.oauth2.authorizationserver.client.console-ui.token.access-token-time-to-live=15m

spring.security.oauth2.authorizationserver.client.observation-connection.registration.client-id=observation-connection
spring.security.oauth2.authorizationserver.client.observation-connection.registration.client-secret=${tolo-idp.seed.client-secret:secret}
