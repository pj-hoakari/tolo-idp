spring.security.oauth2.authorizationserver.client.observation-connection.registration.redirect-uris=http://localhost:3000/api/auth/callback/observation-connection,http://127.0.0.1:3000/api/auth/callback/observation-connection,http://localhost:3000/api/auth/connection/callback,http://127.0.0.1:3000/api/auth/connection/callback
spring.security.oauth2.authorizationserver.client.observation-connection.registration.scopes=openid,profile,events.read
spring.security.oauth2.authorizationserver.client.observation-connection.require-proof-key=true
spring.security.oauth2.authorizationserver.client.observation-connection.require-authorization-consent=false
spring.security.oauth2.authorizationserver.client.observation-connection.token.access-token-format=self-contained
spring.security.oauth2.authorizationserver.client.observation-connection.token.reuse-refresh-tokens=false
spring.security.oauth2.authorizationserver.client.observation-connection.token.refresh-token-time-to-live=24h
spring.security.oauth2.authorizationserver.client.observation-connection.token.access-token-time-to-live=15m

