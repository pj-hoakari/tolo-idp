spring:
  application:
    name: tolo-idp
  datasource:
    url: jdbc:h2:mem:tolo-idp;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: true
  h2:
    console:
      enabled: false
  cloud:
    gcp:
      core:
        enabled: false

server:
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        name: __Host-tolo_idp_session
        secure: true
        http-only: true
        same-site: lax
        path: /

logging:
  level:
    org.springframework.security: INFO

tolo-idp:
  issuer: http://localhost:8080
  resource:
    allowed-hosts: api.example.com
  relation:
    base-url: http://localhost:8081
    cache:
      ttl: 5m
  jwk:
    allow-ephemeral: true

---

spring:
  config:
    activate:
      on-profile: production
  datasource:
    driver-class-name: org.postgresql.Driver
  flyway:
    locations: classpath:db/postgresql

tolo-idp:
  seed:
    enabled: false
  jwk:
    allow-ephemeral: false

---

# AOT records production as active. An explicitly selected dev profile must override it.
spring:
  config:
    activate:
      on-profile: "dev-jvm | dev-native"
  datasource:
    url: jdbc:postgresql://db:5432/tolo_idp
    driver-class-name: org.postgresql.Driver
    username: tolo_idp
    password: tolo_idp
  flyway:
    locations: classpath:db/postgresql
  security:
    oauth2:
      authorizationserver:
        client:
          client-123:
            registration:
              client-id: client-123
              client-secret: "${tolo-idp.seed.client-secret:secret}"
              client-name: Development confidential client
              client-authentication-methods:
                - client_secret_basic
                - client_secret_post
              authorization-grant-types:
                - authorization_code
                - refresh_token
                - urn:ietf:params:oauth:grant-type:token-exchange
              redirect-uris:
                - http://127.0.0.1:8080/login/oauth2/code/client-123
                - http://127.0.0.1:18080/login/oauth2/code/client-123
                - http://localhost:3000/api/auth/callback/tolo-idp
              post-logout-redirect-uris:
                - http://localhost:3000/auth/logged-out
              scopes:
                - openid
                - profile
                - tenant.read
                - tenant.write
                - tenant.join
                - events.read
                - events.manage
                - events.operate
                - events.report
            require-proof-key: true
            require-authorization-consent: false
            token:
              reuse-refresh-tokens: false
              refresh-token-time-to-live: 1h
              authorization-code-time-to-live: 5m
              access-token-time-to-live: 15m
              access-token-format: self-contained
          console-ui:
            registration:
              client-id: console-ui
              client-secret: "${tolo-idp.seed.client-secret:secret}"
              client-name: Development BFF client
              client-authentication-methods:
                - client_secret_basic
                - client_secret_post
              authorization-grant-types:
                - authorization_code
                - refresh_token
                - urn:ietf:params:oauth:grant-type:token-exchange
              redirect-uris:
                - http://localhost:3000/api/auth/callback/console-ui
                - http://127.0.0.1:3000/api/auth/callback/console-ui
                - http://localhost:3000/api/auth/callback/tolo-idp
                - http://127.0.0.1:3000/api/auth/callback/tolo-idp
                - http://localhost:13000/api/auth/callback/console-ui
                - http://127.0.0.1:13000/api/auth/callback/console-ui
                - http://localhost:13001/api/auth/callback/console-ui
                - http://127.0.0.1:13001/api/auth/callback/console-ui
                - http://localhost:13001/api/auth/callback/tolo-idp
                - http://127.0.0.1:13001/api/auth/callback/tolo-idp
              scopes:
                - openid
                - profile
                - tenant.read
                - tenant.write
                - tenant.join
                - events.read
                - events.manage
                - events.operate
                - events.report
            require-proof-key: true
            require-authorization-consent: false
            token:
              reuse-refresh-tokens: false
              refresh-token-time-to-live: 1h
              authorization-code-time-to-live: 5m
              access-token-time-to-live: 15m
              access-token-format: self-contained
          edge-page:
            registration:
              client-id: edge-page
              client-secret: "${tolo-idp.seed.client-secret:secret}"
              client-name: Observation page BFF client
              client-authentication-methods:
                - client_secret_basic
                - client_secret_post
              authorization-grant-types:
                - authorization_code
                - refresh_token
                - urn:ietf:params:oauth:grant-type:token-exchange
              redirect-uris:
                - http://localhost:3000/api/auth/machine/callback
                - http://127.0.0.1:3000/api/auth/machine/callback
                - http://localhost:13001/api/auth/machine/callback
                - http://127.0.0.1:13001/api/auth/machine/callback
              post-logout-redirect-uris:
                - http://localhost:3000/auth/logged-out
                - http://127.0.0.1:3000/auth/logged-out
                - http://localhost:13000/auth/logged-out
                - http://127.0.0.1:13000/auth/logged-out
                - http://localhost:13001/auth/logged-out
                - http://127.0.0.1:13001/auth/logged-out
              scopes:
                - openid
                - profile
                - events.report
            require-proof-key: true
            require-authorization-consent: false
            token:
              reuse-refresh-tokens: false
              refresh-token-time-to-live: 24h
              authorization-code-time-to-live: 5m
              access-token-time-to-live: 15m
              access-token-format: self-contained
          observation-connection:
            registration:
              client-id: observation-connection
              client-secret: "${tolo-idp.seed.client-secret:secret}"
              client-name: Observation connection client
              client-authentication-methods:
                - client_secret_basic
                - client_secret_post
              authorization-grant-types:
                - authorization_code
                - refresh_token
                - urn:ietf:params:oauth:grant-type:token-exchange
              redirect-uris:
                - http://localhost:3000/api/auth/callback/observation-connection
                - http://127.0.0.1:3000/api/auth/callback/observation-connection
                - http://localhost:3000/api/auth/connection/callback
                - http://127.0.0.1:3000/api/auth/connection/callback
                - http://localhost:13000/api/auth/connection/callback
                - http://127.0.0.1:13000/api/auth/connection/callback
                - http://localhost:13001/api/auth/connection/callback
                - http://127.0.0.1:13001/api/auth/connection/callback
              scopes:
                - openid
                - profile
                - events.read
            require-proof-key: true
            require-authorization-consent: false
            token:
              reuse-refresh-tokens: false
              refresh-token-time-to-live: 24h
              authorization-code-time-to-live: 5m
              access-token-time-to-live: 15m
              access-token-format: self-contained
          esp-camera:
            registration:
              client-id: esp-camera
              client-name: ESP camera
              client-authentication-methods:
                - none
              authorization-grant-types:
                - urn:ietf:params:oauth:grant-type:device_code
                - refresh_token
              scopes:
                - events.stream
            require-proof-key: false
            require-authorization-consent: false
            token:
              reuse-refresh-tokens: false
              refresh-token-time-to-live: 24h
              device-code-time-to-live: 10m
              access-token-time-to-live: 10m
              access-token-format: self-contained
          service-gateway:
            registration:
              client-id: service-gateway
              client-secret: "${TOLO_IDP_SERVICE_GATEWAY_CLIENT_SECRET:gateway-secret}"
              client-name: Development service gateway
              client-authentication-methods:
                - client_secret_basic
                - client_secret_post
              authorization-grant-types:
                - refresh_token

server:
  servlet:
    session:
      cookie:
        name: tolo_idp_session
        secure: false

tolo-idp:
  relation:
    base-url: http://relation-stub:8080
  rate-limit:
    redis:
      uri: redis://redis:6379
  clients:
    client-123:
      allowed-audiences:
        - backend-api
      allowed-token-exchange-transitions:
        - tenant_access:event_access
      tenant-access-ttl: 15m
      event-access-ttl: 10m
    console-ui:
      allowed-audiences:
        - backend-api
      allowed-token-exchange-transitions:
        - tenant_access:event_access
      tenant-access-ttl: 15m
      event-access-ttl: 10m
    observation-connection:
      allowed-audiences:
        - backend-api
      allowed-token-exchange-transitions:
        - tenant_access:event_access
      tenant-access-ttl: 15m
      event-access-ttl: 10m
    edge-page:
      allowed-audiences:
        - backend-api
      allowed-token-exchange-transitions:
        - tenant_access:event_access
      tenant-access-ttl: 15m
      event-access-ttl: 10m
    esp-camera:
      allowed-audiences:
        - backend-api
      tenant-access-ttl: 15m
      event-access-ttl: 10m
    service-gateway:
      allowed-audiences:
        - backend-api
      token-introspection-allowed: true
  issuer: http://localhost:18080
  seed:
    enabled: true
    users-file: classpath:seed/users.json
  jwk:
    allow-ephemeral: true
  login:
    page-url: http://localhost:3000/login
    error-page-url: http://localhost:3000/auth/error
