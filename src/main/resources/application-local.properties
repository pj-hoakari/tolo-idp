spring.datasource.url=jdbc:postgresql://localhost:5432/tolo_idp
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=tolo_idp
spring.datasource.password=tolo_idp
spring.flyway.locations=classpath:db/postgresql

tolo-idp.issuer=http://localhost:8080
tolo-idp.rate-limit.redis.uri=redis://localhost:6379
tolo-idp.seed.enabled=true
tolo-idp.jwk.allow-ephemeral=true
tolo-idp.cors.allowed-origins=http://localhost:3000
