name: tolo-idp-prod

services:
  app:
    image: ${TOLO_IDP_IMAGE:-tolo-idp:0.0.1-SNAPSHOT}
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: production
      TZ: UTC
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/tolo_idp
      SPRING_DATASOURCE_USERNAME: ${TOLO_IDP_POSTGRES_USER:-tolo_idp}
      SPRING_DATASOURCE_PASSWORD: ${TOLO_IDP_POSTGRES_PASSWORD:?TOLO_IDP_POSTGRES_PASSWORD is required}
      TOLO_IDP_ISSUER: ${TOLO_IDP_ISSUER:?TOLO_IDP_ISSUER is required}
      TOLO_IDP_LOGIN_PAGE_URL: ${TOLO_IDP_LOGIN_PAGE_URL:?TOLO_IDP_LOGIN_PAGE_URL is required}
      TOLO_IDP_LOGIN_ERROR_PAGE_URL: ${TOLO_IDP_LOGIN_ERROR_PAGE_URL:?TOLO_IDP_LOGIN_ERROR_PAGE_URL is required}
      TOLO_IDP_RATE_LIMIT_REDIS_URI: redis://redis:6379
      TOLO_IDP_JWK_PRIVATE_KEY_LOCATION: file:${TOLO_IDP_JWK_PRIVATE_KEY_LOCATION:?TOLO_IDP_JWK_PRIVATE_KEY_LOCATION is required}
    volumes:
      - ${TOLO_IDP_JWK_PRIVATE_KEY_HOST_PATH:?TOLO_IDP_JWK_PRIVATE_KEY_HOST_PATH is required}:${TOLO_IDP_JWK_PRIVATE_KEY_LOCATION:?TOLO_IDP_JWK_PRIVATE_KEY_LOCATION is required}:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine@sha256:d3244e8ce3f165ee3c93d9c4a4b1d0fe48b3a89e2287b717fdcbbde92d405065
    environment:
      POSTGRES_DB: tolo_idp
      POSTGRES_USER: ${TOLO_IDP_POSTGRES_USER:-tolo_idp}
      POSTGRES_PASSWORD: ${TOLO_IDP_POSTGRES_PASSWORD:?TOLO_IDP_POSTGRES_PASSWORD is required}
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-prod-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  runn:
    image: ghcr.io/k1low/runn:v1.10.0-slim@sha256:834cfff7353bf0395faca45c9baa42a3f93920421553ea41f9ea47c3c5952778
    profiles:
      - scenario
    entrypoint: ["runn"]
    command: ["run", "--verbose", "--host-rules", "localhost app:8080", "--scopes", "read:parent", "/books/production/startup.yml"]
    environment:
      IDP_ISSUER: ${TOLO_IDP_ISSUER:?TOLO_IDP_ISSUER is required}
    volumes:
      - ./scenario:/books:ro
    depends_on:
      app:
        condition: service_started
    restart: "no"

volumes:
  postgres-prod-data:
  redis-prod-data:
