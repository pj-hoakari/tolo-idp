name: tolo-idp-prod

services:
  app:
    image: ${TOLO_IDP_IMAGE:-tolo-idp:0.0.1-SNAPSHOT}
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/tolo_idp
      SPRING_DATASOURCE_USERNAME: ${TOLO_IDP_POSTGRES_USER:-tolo_idp}
      SPRING_DATASOURCE_PASSWORD: ${TOLO_IDP_POSTGRES_PASSWORD:?TOLO_IDP_POSTGRES_PASSWORD is required}
      SPRING_FLYWAY_LOCATIONS: classpath:db/postgresql
      TOLO_IDP_ISSUER: ${TOLO_IDP_ISSUER:?TOLO_IDP_ISSUER is required}
      TOLO_IDP_RATE_LIMIT_REDIS_URI: redis://redis:6379
      TOLO_IDP_SEED_ENABLED: "false"
      TOLO_IDP_JWK_ALLOW_EPHEMERAL: "false"
      TOLO_IDP_JWK_PRIVATE_KEY_LOCATION: file:${TOLO_IDP_JWK_PRIVATE_KEY_LOCATION:?TOLO_IDP_JWK_PRIVATE_KEY_LOCATION is required}
    volumes:
      - ${TOLO_IDP_JWK_PRIVATE_KEY_HOST_PATH:?TOLO_IDP_JWK_PRIVATE_KEY_HOST_PATH is required}:${TOLO_IDP_JWK_PRIVATE_KEY_LOCATION:?TOLO_IDP_JWK_PRIVATE_KEY_LOCATION is required}:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tolo_idp
      POSTGRES_USER: ${TOLO_IDP_POSTGRES_USER:-tolo_idp}
      POSTGRES_PASSWORD: ${TOLO_IDP_POSTGRES_PASSWORD:?TOLO_IDP_POSTGRES_PASSWORD is required}
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-prod-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres-prod-data:
  redis-prod-data:
