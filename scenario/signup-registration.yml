desc: サインアップから registration の発行まで検証する
labels:
  - signup
  - registration
runners:
  health:
    endpoint: ${IDP_ISSUER:-http://localhost:18080}
    notFollowRedirect: true
    timeout: 2sec
  idp:
    endpoint: ${IDP_ISSUER:-http://localhost:18080}
    useCookie: true
    notFollowRedirect: true
    timeout: 10sec
vars:
  issuer: ${IDP_ISSUER:-http://localhost:18080}
  password: correct horse battery
  tenant_id: tenant-onboarding
  web_origin: http://localhost:3000
  login_page: http://localhost:3000/login
  client_id: client-123
  client_secret: secret
  gateway_client_id: service-gateway
  gateway_client_secret: gateway-secret
  redirect_uri: http://127.0.0.1:8080/login/oauth2/code/client-123
  audience: backend-api
  tenant_resource: https://api.example.com/tenants/tenant-onboarding
  state: scenario-state-registration
  code_verifier: dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk
  code_challenge: E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
secrets:
  - vars.password
  - vars.client_secret
  - vars.code_verifier
  - challenge
  - '"Basic " + toBase64(vars.client_id + ":" + vars.client_secret)'
  - vars.gateway_client_secret
  - '"Basic " + toBase64(vars.gateway_client_id + ":" + vars.gateway_client_secret)'
  - authorization_code
  - registration_token
  - current.res.body.access_token
  - current.res.cookies["tolo_idp_session"].Value
  - current.res.headers["Set-Cookie"][0]
  - 'url(current.res.headers["Location"][0]).Query().Get("code")'
steps:
  wait_for_idp:
    include: helpers/wait-for-idp.yml

  discovery:
    desc: Discovery が tenant.join を公開し、tenant.claim を公開しない
    idp:
      /.well-known/openid-configuration:
        get:
          useCookie: false
          headers:
            Accept: application/json
          body: null
    test: |
      current.res.status == 200
      && "tenant.join" in current.res.body.scopes_supported
      && "tenant.claim" not in current.res.body.scopes_supported
    bind:
      authorization_path: trimPrefix(current.res.body.authorization_endpoint, vars.issuer)
      token_path: trimPrefix(current.res.body.token_endpoint, vars.issuer)
      introspection_path: trimPrefix(current.res.body.introspection_endpoint, vars.issuer)
      username: '"owner-" + faker.UUID()'

  reject_mixed_scope:
    desc: tenant.join と他の scope を併せた認可要求は challenge を発行せず invalid_scope を返す
    idp:
      "{{ authorization_path }}?response_type=code&client_id={{ urlencode(vars.client_id) }}&redirect_uri={{ urlencode(vars.redirect_uri) }}&scope={{ urlencode('openid tenant.join') }}&resource={{ urlencode(vars.tenant_resource) }}&state={{ urlencode(vars.state) }}&code_challenge={{ urlencode(vars.code_challenge) }}&code_challenge_method=S256":
        get:
          useCookie: false
          headers:
            Accept: text/html
          body: null
    test: |
      current.res.status == 302
      && hasPrefix(current.res.headers["Location"][0], vars.redirect_uri + "?")
      && url(current.res.headers["Location"][0]).Query().Get("error") == "invalid_scope"

  authorize:
    desc: 対象テナントの resource と tenant.join の認可要求は Web のログイン画面へ challenge だけを付けてリダイレクトする
    idp:
      "{{ authorization_path }}?response_type=code&client_id={{ urlencode(vars.client_id) }}&redirect_uri={{ urlencode(vars.redirect_uri) }}&scope=tenant.join&resource={{ urlencode(vars.tenant_resource) }}&state={{ urlencode(vars.state) }}&code_challenge={{ urlencode(vars.code_challenge) }}&code_challenge_method=S256":
        get:
          headers:
            Accept: text/html
          body: null
    test: |
      current.res.status == 302
      && hasPrefix(current.res.headers["Location"][0], vars.login_page + "?challenge=")
      && len(url(current.res.headers["Location"][0]).Query()) == 1
    bind:
      challenge: url(current.res.headers["Location"][0]).Query().Get("challenge")

  signup:
    desc: サインアップ画面と同じ形で challenge と資格情報を送ると、challenge のテナントにユーザーを作り、セッションを作る
    idp:
      /api/signup:
        post:
          headers:
            Origin: "{{ vars.web_origin }}"
            Referer: "{{ vars.login_page }}"
            Accept: application/json
          body:
            application/json:
              username: "{{ username }}"
              password: "{{ vars.password }}"
              challenge: "{{ challenge }}"
    test: |
      current.res.status == 201
      && current.res.body.username == username
      && current.res.body.tenantId == vars.tenant_id
      && current.res.body.resource == vars.tenant_resource
      && current.res.body.sub matches "^[0-9a-f-]{36}$"
      && current.res.cookies["tolo_idp_session"] != nil
      && current.res.cookies["tolo_idp_session"].HttpOnly

  resume:
    desc: サインアップで認証した challenge で元の認可要求を再開し、認可コードを取得する
    idp:
      "{{ authorization_path }}?challenge={{ urlencode(challenge) }}":
        get:
          headers:
            Accept: text/html
          body: null
    test: |
      current.res.status == 302
      && hasPrefix(current.res.headers["Location"][0], vars.redirect_uri + "?")
      && url(current.res.headers["Location"][0]).Query().Get("error") == ""
      && url(current.res.headers["Location"][0]).Query().Get("code") != ""
    bind:
      authorization_code: url(current.res.headers["Location"][0]).Query().Get("code")

  registration_token:
    desc: 認可コードを registration に交換する。ID Token と Refresh Token は発行しない
    idp:
      "{{ token_path }}":
        post:
          useCookie: false
          headers:
            Authorization: 'Basic {{ toBase64(vars.client_id + ":" + vars.client_secret) }}'
          body:
            application/x-www-form-urlencoded:
              grant_type: authorization_code
              code: "{{ authorization_code }}"
              redirect_uri: "{{ vars.redirect_uri }}"
              code_verifier: "{{ vars.code_verifier }}"
    test: |
      current.res.status == 200
      && current.res.body.scope == "tenant.join"
      && "id_token" not in current.res.body
      && "refresh_token" not in current.res.body
      && current.res.body.expires_in <= 600
    bind:
      registration_token: current.res.body.access_token
      registration_claims: fromJSON(fromBase64(replace(replace(split(current.res.body.access_token, ".")[1], "-", "+"), "_", "/") + repeat("=", (4 - len(split(current.res.body.access_token, ".")[1]) % 4) % 4)))

  inspect_registration_jwt:
    desc: registration はテナントを持たず、scope は tenant.join だけである
    test: |
      registration_claims.token_use == "registration"
      && registration_claims.scope == "tenant.join"
      && registration_claims.sub == steps.signup.res.body.sub
      && registration_claims.client_id == vars.client_id
      && registration_claims.aud == vars.audience
      && "tenant_id" not in registration_claims
      && "event_id" not in registration_claims
      && "resource" not in registration_claims
      && registration_claims.exp - registration_claims.iat <= 600

  inspect_registration_introspection:
    desc: Service Gateway の Introspection で registration の claim を確認する
    idp:
      "{{ introspection_path }}":
        post:
          useCookie: false
          headers:
            Authorization: 'Basic {{ toBase64(vars.gateway_client_id + ":" + vars.gateway_client_secret) }}'
          body:
            application/x-www-form-urlencoded:
              token: "{{ registration_token }}"
    test: |
      current.res.status == 200
      && current.res.body.active == true
      && current.res.body.token_use == "registration"
      && current.res.body.scope == "tenant.join"
      && "tenant_id" not in current.res.body

  reject_exchange:
    desc: registration は Token Exchange の交換元にできない
    idp:
      "{{ token_path }}":
        post:
          useCookie: false
          headers:
            Authorization: 'Basic {{ toBase64(vars.client_id + ":" + vars.client_secret) }}'
          body:
            application/x-www-form-urlencoded:
              grant_type: urn:ietf:params:oauth:grant-type:token-exchange
              subject_token: "{{ registration_token }}"
              subject_token_type: urn:ietf:params:oauth:token-type:access_token
              audience: "{{ vars.audience }}"
              resource: "{{ vars.tenant_resource }}/events/event-1"
              scope: events.read
    test: current.res.status == 400 && current.res.body.error == "invalid_grant"
