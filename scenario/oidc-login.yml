desc: OIDC ログインから tenant_access 発行、event_access への交換まで検証する
labels:
  - oidc
  - login
  - token-exchange
runners:
  # Define the health runner here so includes reuse the CLI host-rule transport.
  health:
    endpoint: ${IDP_ISSUER:-http://localhost:18080}
    notFollowRedirect: true
    timeout: 2sec
  idp:
    endpoint: ${IDP_ISSUER:-http://localhost:18080}
    useCookie: true
    notFollowRedirect: true
    timeout: 10sec
vars:
  issuer: ${IDP_ISSUER:-http://localhost:18080}
  username: user-123
  password: password
  tenant_id: tenant-a
  client_id: client-123
  client_secret: secret
  redirect_uri: http://127.0.0.1:8080/login/oauth2/code/client-123
  audience: backend-api
  scope: openid tenant.read events.read events.manage events.operate events.report
  event_scope: events.read events.manage events.operate events.report
  tenant_resource: https://api.example.com/tenants/tenant-a
  event_resource: https://api.example.com/tenants/tenant-a/events/event-1
  state: scenario-state-0123456789
  nonce: scenario-nonce-0123456789
  # RFC 7636 Appendix B: fixed verifier/challenge pair for this development client.
  code_verifier: dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk
  code_challenge: E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
secrets:
  - vars.password
  - vars.client_secret
  - vars.code_verifier
  - '"Basic " + toBase64(vars.client_id + ":" + vars.client_secret)'
  - authorization_code
  - tenant_access_token
  - 'split(tenant_access_token, ".")[1]'
  - event_access_token
  - 'split(event_access_token, ".")[1]'
  - current.res.body.access_token
  - current.res.body.id_token
  - current.res.body.refresh_token
  - current.res.cookies["JSESSIONID"].Value
  - current.res.headers["Set-Cookie"][0]
  - 'url(current.res.headers["Location"][0]).Query().Get("code")'
steps:
  wait_for_idp:
    include: helpers/wait-for-idp.yml

  discovery:
    desc: Discovery から endpoint を取得する
    idp:
      /.well-known/openid-configuration:
        get:
          useCookie: false
          headers:
            Accept: application/json
          body: null
    test: |
      current.res.status == 200
      && current.res.body.issuer == vars.issuer
      && hasPrefix(current.res.body.authorization_endpoint, vars.issuer + "/")
      && hasPrefix(current.res.body.token_endpoint, vars.issuer + "/")
      && hasPrefix(current.res.body.introspection_endpoint, vars.issuer + "/")
      && hasPrefix(current.res.body.jwks_uri, vars.issuer + "/")
      && "code" in current.res.body.response_types_supported
      && "authorization_code" in current.res.body.grant_types_supported
      && "urn:ietf:params:oauth:grant-type:token-exchange" in current.res.body.grant_types_supported
      && "openid" in current.res.body.scopes_supported
      && "S256" in current.res.body.code_challenge_methods_supported
      && "RS256" in current.res.body.id_token_signing_alg_values_supported
      && "client_secret_basic" in current.res.body.token_endpoint_auth_methods_supported
    bind:
      authorization_path: trimPrefix(current.res.body.authorization_endpoint, vars.issuer)
      token_path: trimPrefix(current.res.body.token_endpoint, vars.issuer)
      introspection_path: trimPrefix(current.res.body.introspection_endpoint, vars.issuer)

  login:
    desc: 同一オリジンのログイン API でセッションを作る
    idp:
      /api/login:
        post:
          headers:
            Origin: "{{ vars.issuer }}"
            Referer: "{{ vars.issuer }}/login"
            Accept: application/json
          body:
            application/json:
              username: "{{ vars.username }}"
              password: "{{ vars.password }}"
              tenantId: "{{ vars.tenant_id }}"

  inspect_login:
    desc: ログインのレスポンスと HttpOnly cookie を確認する
    # Keep the HTTP response in steps.login so logout can run even if this test fails.
    test: |
      steps.login.res.status == 200
      && steps.login.res.body.username == vars.username
      && steps.login.res.body.tenantId == vars.tenant_id
      && steps.login.res.body.resource == vars.tenant_resource
      && "ROLE_USER" in steps.login.res.body.authorities
      && steps.login.res.cookies["JSESSIONID"] != nil
      && steps.login.res.cookies["JSESSIONID"].HttpOnly

  authorize:
    desc: セッションと PKCE を使って認可コードを取得する
    idp:
      "{{ authorization_path }}?response_type=code&client_id={{ urlencode(vars.client_id) }}&redirect_uri={{ urlencode(vars.redirect_uri) }}&scope={{ urlencode(vars.scope) }}&audience={{ urlencode(vars.audience) }}&state={{ urlencode(vars.state) }}&nonce={{ urlencode(vars.nonce) }}&code_challenge={{ urlencode(vars.code_challenge) }}&code_challenge_method=S256":
        get:
          headers:
            Accept: text/html
          body: null
    test: |
      current.res.status == 302
      && current.res.headers["Location"] != nil
      && hasPrefix(current.res.headers["Location"][0], vars.redirect_uri + "?")
      && url(current.res.headers["Location"][0]).Query().Get("error") == ""
      && url(current.res.headers["Location"][0]).Query().Get("state") == vars.state
      && url(current.res.headers["Location"][0]).Query().Get("code") != ""
    bind:
      authorization_code: url(current.res.headers["Location"][0]).Query().Get("code")

  tenant_token:
    desc: 認可コードを tenant_access と ID Token に交換する
    idp:
      "{{ token_path }}":
        post:
          useCookie: false
          headers:
            Authorization: 'Basic {{ toBase64(vars.client_id + ":" + vars.client_secret) }}'
          body:
            application/x-www-form-urlencoded:
              grant_type: authorization_code
              code: "{{ authorization_code }}"
              redirect_uri: "{{ vars.redirect_uri }}"
              code_verifier: "{{ vars.code_verifier }}"
    test: |
      current.res.status == 200
      && current.res.body.token_type == "Bearer"
      && current.res.body.expires_in > 0
      && current.res.body.access_token matches "^[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+$"
      && current.res.body.id_token matches "^[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+$"
      && len(split(current.res.body.scope, " ")) == len(split(vars.scope, " "))
      && all(split(vars.scope, " "), {# in split(current.res.body.scope, " ")})
    bind:
      tenant_access_token: current.res.body.access_token
      # Decode the Base64URL payload; signature verification is covered by Kotlin tests.
      tenant_access_claims: fromJSON(fromBase64(replace(replace(split(current.res.body.access_token, ".")[1], "-", "+"), "_", "/") + repeat("=", (4 - len(split(current.res.body.access_token, ".")[1]) % 4) % 4)))

  inspect_tenant_jwt:
    desc: tenant_access の JWT 本体に必須 jti があり、role claim がないことを確認する
    test: |
      "jti" in tenant_access_claims
      && type(tenant_access_claims.jti) == "string"
      && tenant_access_claims.jti != ""
      && "role" not in tenant_access_claims
      && "tenant_role" not in tenant_access_claims
      && "event_role" not in tenant_access_claims

  inspect_tenant_token:
    desc: tenant_access の claim を認証付き Introspection で確認する
    idp:
      "{{ introspection_path }}":
        post:
          useCookie: false
          headers:
            Authorization: 'Basic {{ toBase64(vars.client_id + ":" + vars.client_secret) }}'
          body:
            application/x-www-form-urlencoded:
              token: "{{ tenant_access_token }}"
              token_type_hint: access_token
    test: |
      current.res.status == 200
      && current.res.body.active == true
      && current.res.body.iss == vars.issuer
      && current.res.body.sub == vars.username
      && current.res.body.client_id == vars.client_id
      && current.res.body.aud == [vars.audience]
      && current.res.body.token_use == "tenant_access"
      && current.res.body.resource == vars.tenant_resource
      && current.res.body.tenant_id == vars.tenant_id
      && "event_id" not in current.res.body
      && len(split(current.res.body.scope, " ")) == len(split(vars.scope, " "))
      && all(split(vars.scope, " "), {# in split(current.res.body.scope, " ")})
      && "jti" in current.res.body
      && type(current.res.body.jti) == "string"
      && current.res.body.jti != ""
      && current.res.body.iat > 0
      && current.res.body.nbf >= current.res.body.iat
      && current.res.body.exp > current.res.body.nbf
      && "role" not in current.res.body
      && "tenant_role" not in current.res.body
      && "event_role" not in current.res.body

  exchange:
    desc: tenant_access を event-1 の event_access に交換する
    idp:
      "{{ token_path }}":
        post:
          useCookie: false
          headers:
            Authorization: 'Basic {{ toBase64(vars.client_id + ":" + vars.client_secret) }}'
          body:
            application/x-www-form-urlencoded:
              grant_type: urn:ietf:params:oauth:grant-type:token-exchange
              subject_token: "{{ tenant_access_token }}"
              subject_token_type: urn:ietf:params:oauth:token-type:access_token
              audience: "{{ vars.audience }}"
              resource: "{{ vars.event_resource }}"
              scope: "{{ vars.event_scope }}"
    test: |
      current.res.status == 200
      && current.res.body.token_type == "Bearer"
      && current.res.body.issued_token_type == "urn:ietf:params:oauth:token-type:access_token"
      && current.res.body.expires_in > 0
      && current.res.body.access_token matches "^[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+$"
      && len(split(current.res.body.scope, " ")) == len(split(vars.event_scope, " "))
      && all(split(vars.event_scope, " "), {# in split(current.res.body.scope, " ")})
    bind:
      event_access_token: current.res.body.access_token
      # Decode the Base64URL payload; signature verification is covered by Kotlin tests.
      event_access_claims: fromJSON(fromBase64(replace(replace(split(current.res.body.access_token, ".")[1], "-", "+"), "_", "/") + repeat("=", (4 - len(split(current.res.body.access_token, ".")[1]) % 4) % 4)))

  inspect_event_jwt:
    desc: event_access の JWT 本体に必須 jti があり、role claim がないことを確認する
    test: |
      "jti" in event_access_claims
      && type(event_access_claims.jti) == "string"
      && event_access_claims.jti != ""
      && "role" not in event_access_claims
      && "tenant_role" not in event_access_claims
      && "event_role" not in event_access_claims

  inspect_event_token:
    desc: event_access の claim を認証付き Introspection で確認する
    idp:
      "{{ introspection_path }}":
        post:
          useCookie: false
          headers:
            Authorization: 'Basic {{ toBase64(vars.client_id + ":" + vars.client_secret) }}'
          body:
            application/x-www-form-urlencoded:
              token: "{{ event_access_token }}"
              token_type_hint: access_token
    test: |
      current.res.status == 200
      && current.res.body.active == true
      && current.res.body.iss == vars.issuer
      && current.res.body.sub == vars.username
      && current.res.body.client_id == vars.client_id
      && current.res.body.aud == [vars.audience]
      && current.res.body.token_use == "event_access"
      && current.res.body.resource == vars.event_resource
      && current.res.body.tenant_id == vars.tenant_id
      && current.res.body.event_id == "event-1"
      && len(split(current.res.body.scope, " ")) == len(split(vars.event_scope, " "))
      && all(split(vars.event_scope, " "), {# in split(current.res.body.scope, " ")})
      && "jti" in current.res.body
      && type(current.res.body.jti) == "string"
      && current.res.body.jti != ""
      && current.res.body.iat > 0
      && current.res.body.nbf >= current.res.body.iat
      && current.res.body.exp > current.res.body.nbf
      && "role" not in current.res.body
      && "tenant_role" not in current.res.body
      && "event_role" not in current.res.body

  reject_event_manage:
    desc: staff の event-2 に対する設計・構成の書き込み要求を拒否する
    idp:
      "{{ token_path }}":
        post:
          useCookie: false
          headers:
            Authorization: 'Basic {{ toBase64(vars.client_id + ":" + vars.client_secret) }}'
          body:
            application/x-www-form-urlencoded:
              grant_type: urn:ietf:params:oauth:grant-type:token-exchange
              subject_token: "{{ tenant_access_token }}"
              subject_token_type: urn:ietf:params:oauth:token-type:access_token
              audience: "{{ vars.audience }}"
              resource: https://api.example.com/tenants/tenant-a/events/event-2
              scope: events.manage
    test: current.res.status == 400 && current.res.body == {"error":"invalid_scope"}

  reject_nonmember_event:
    desc: 未所属の event-3 への交換を詳細を漏らさず拒否する
    idp:
      "{{ token_path }}":
        post:
          useCookie: false
          headers:
            Authorization: 'Basic {{ toBase64(vars.client_id + ":" + vars.client_secret) }}'
          body:
            application/x-www-form-urlencoded:
              grant_type: urn:ietf:params:oauth:grant-type:token-exchange
              subject_token: "{{ tenant_access_token }}"
              subject_token_type: urn:ietf:params:oauth:token-type:access_token
              audience: "{{ vars.audience }}"
              resource: https://api.example.com/tenants/tenant-a/events/event-3
              scope: events.read
    test: current.res.status == 400 && current.res.body == {"error":"invalid_grant"}

  reject_audience:
    desc: client に許可されていない audience を拒否する
    idp:
      "{{ token_path }}":
        post:
          useCookie: false
          headers:
            Authorization: 'Basic {{ toBase64(vars.client_id + ":" + vars.client_secret) }}'
          body:
            application/x-www-form-urlencoded:
              grant_type: urn:ietf:params:oauth:grant-type:token-exchange
              subject_token: "{{ tenant_access_token }}"
              subject_token_type: urn:ietf:params:oauth:token-type:access_token
              audience: other-api
              resource: "{{ vars.event_resource }}"
              scope: events.read
    test: current.res.status == 400 && current.res.body == {"error":"invalid_target"}

  logout:
    desc: 作成したセッションを破棄する
    defer: true
    if: 'steps.login?.res?.status == 200'
    idp:
      /api/logout:
        post:
          body:
            application/json: {}
    test: current.res.status == 204
