# Dev stack with IdP in a container (Spring profile: dev.native).

name: tolo-idp-dev

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.jvm
    image: tolo-idp-dev-native:local
    ports:
      - "18080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev.native
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      relation-stub:
        condition: service_started
    restart: unless-stopped

  relation-stub:
    image: ghcr.io/pj-hoakari/tolo-relation-stub:latest
    ports:
      - "18081:8080"
    environment:
      RELATION_ADDR: ":8080"
      RELATION_DATA: /data/sample.json
    volumes:
      - ./relation-stub:/data:ro
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    ports:
      - "15432:5432"
    environment:
      POSTGRES_DB: tolo_idp
      POSTGRES_USER: tolo_idp
      POSTGRES_PASSWORD: tolo_idp
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "16379:6379"
    volumes:
      - redis-dev-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres-dev-data:
  redis-dev-data:
